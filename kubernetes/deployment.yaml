apiVersion: apps/v1
kind: Deployment

metadata:
  name: webapp

spec:

  replicas: 2

  selector:
    matchLabels:
      app: webapp

  strategy:
    type: RollingUpdate

    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:

    metadata:
      labels:
        app: webapp

    spec:

      containers:

        - name: webapp

          # Jenkins will replace this
          image: YOUR_DOCKERHUB_USERNAME/webapp:latest

          imagePullPolicy: Always

          ports:

            - containerPort: 8080

          readinessProbe:

            httpGet:
              path: /
              port: 8080

            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5

          livenessProbe:

            httpGet:
              path: /
              port: 8090

            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5

          resources:

            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "512Mi"
